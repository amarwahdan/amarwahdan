    .dash { animation: dash 8s linear infinite; }
    .blink { animation: blink 2.7s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.38; transform:scale(.94); } 50% { opacity:1; transform:scale(1.06); } }
    @keyframes drift { 0%,100% { transform:translate(0,0); } 50% { transform:translate(0,-5px); } }
    @keyframes dash { to { stroke-dashoffset:-180; } }
    @keyframes blink { 0%,100% { opacity:.32; } 50% { opacity:1; } }
  </style>
