<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Tech stack as an AI capability pipeline</title><desc id="desc">Signals enter representation, branch into learning or retrieval, then inference and validation. Animation illustrates flow only.</desc><defs><linearGradient id="bg"><stop stop-color="#091321"/><stop offset="1" stop-color="#13112C"/></linearGradient><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#43E8E1"/></marker></defs><style>.mono{font-family:Consolas,monospace}.sans{font-family:Arial,Helvetica,sans-serif}@media(prefers-reduced-motion:reduce){.motion{display:none}}</style><rect x="1" y="1" width="1198" height="468" rx="20" fill="url(#bg)" stroke="#26334D"/><text x="40" y="35" class="mono" font-size="12" letter-spacing="2" fill="#43E8E1">TECH STACK / CAPABILITY GRAPH</text><path d="M245 220H275" fill="none" stroke="#43E8E1" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#arrow)"/><circle class="motion" r="3" fill="#A78BFA"><animateMotion dur="4s" begin="0.0s" repeatCount="indefinite" path="M245 220H275"/></circle><path d="M480 220H496V120H515" fill="none" stroke="#43E8E1" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#arrow)"/><circle class="motion" r="3" fill="#A78BFA"><animateMotion dur="5s" begin="0.6s" repeatCount="indefinite" path="M480 220H496V120H515"/></circle><path d="M480 220H496V315H515" fill="none" stroke="#43E8E1" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#arrow)"/><circle class="motion" r="3" fill="#A78BFA"><animateMotion dur="6s" begin="1.2s" repeatCount="indefinite" path="M480 220H496V315H515"/></circle><path d="M720 120H740V220H755" fill="none" stroke="#43E8E1" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#arrow)"/><circle class="motion" r="3" fill="#A78BFA"><animateMotion dur="4s" begin="1.7999999999999998s" repeatCount="indefinite" path="M720 120H740V220H755"/></circle><path d="M720 315H740V220H755" fill="none" stroke="#43E8E1" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#arrow)"/><circle class="motion" r="3" fill="#A78BFA"><animateMotion dur="5s" begin="2.4s" repeatCount="indefinite" path="M720 315H740V220H755"/></circle><path d="M960 220H990" fill="none" stroke="#43E8E1" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#arrow)"/><circle class="motion" r="3" fill="#A78BFA"><animateMotion dur="6s" begin="3.0s" repeatCount="indefinite" path="M960 220H990"/></circle><path d="M1092 295V416H376V295" fill="none" stroke="#A78BFA" stroke-dasharray="5 7" stroke-opacity=".5"/><text x="690" y="440" text-anchor="middle" class="mono" font-size="12" fill="#9BAFCF">INSPECT / EVALUATE / REFINE</text><rect x="40" y="160" width="205" height="135" rx="12" fill="#0D1B2E" stroke="#324564"/><rect x="40" y="160" width="205" height="3" rx="1" fill="#43E8E1"/><text x="54" y="187" class="mono" font-size="10" letter-spacing="1.1" fill="#A78BFA">01 / SIGNALS</text><text x="54" y="217" class="sans" font-size="15" font-weight="700" fill="#EFF5FF">Data &amp; inputs</text><text x="54" y="247" class="sans" font-size="12" fill="#B7C7E0">Python / SQL</text><text x="54" y="270" class="sans" font-size="12" fill="#B7C7E0">NumPy / pandas</text><rect x="275" y="160" width="205" height="135" rx="12" fill="#0D1B2E" stroke="#324564"/><rect x="275" y="160" width="205" height="3" rx="1" fill="#43E8E1"/><text x="289" y="187" class="mono" font-size="10" letter-spacing="1.1" fill="#A78BFA">02 / REPRESENT</text><text x="289" y="217" class="sans" font-size="15" font-weight="700" fill="#EFF5FF">Features &amp; context</text><text x="289" y="247" class="sans" font-size="12" fill="#B7C7E0">EDA / OpenCV</text><text x="289" y="270" class="sans" font-size="12" fill="#B7C7E0">spaCy / NLTK</text><rect x="515" y="60" width="205" height="135" rx="12" fill="#0D1B2E" stroke="#324564"/><rect x="515" y="60" width="205" height="3" rx="1" fill="#43E8E1"/><text x="529" y="87" class="mono" font-size="10" letter-spacing="1.1" fill="#A78BFA">03A / LEARN</text><text x="529" y="117" class="sans" font-size="15" font-weight="700" fill="#EFF5FF">Train &amp; adapt</text><text x="529" y="147" class="sans" font-size="12" fill="#B7C7E0">PyTorch / TensorFlow</text><text x="529" y="170" class="sans" font-size="12" fill="#B7C7E0">scikit-learn / LoRA</text><rect x="515" y="255" width="205" height="135" rx="12" fill="#0D1B2E" stroke="#324564"/><rect x="515" y="255" width="205" height="3" rx="1" fill="#43E8E1"/><text x="529" y="282" class="mono" font-size="10" letter-spacing="1.1" fill="#A78BFA">03B / REASON</text><text x="529" y="312" class="sans" font-size="15" font-weight="700" fill="#EFF5FF">Retrieve &amp; orchestrate</text><text x="529" y="342" class="sans" font-size="12" fill="#B7C7E0">LangChain / CrewAI</text><text x="529" y="365" class="sans" font-size="12" fill="#B7C7E0">Google ADK / RAG</text><rect x="755" y="160" width="205" height="135" rx="12" fill="#0D1B2E" stroke="#324564"/><rect x="755" y="160" width="205" height="3" rx="1" fill="#43E8E1"/><text x="769" y="187" class="mono" font-size="10" letter-spacing="1.1" fill="#A78BFA">04 / INFERENCE</text><text x="769" y="217" class="sans" font-size="15" font-weight="700" fill="#EFF5FF">Model execution</text><text x="769" y="247" class="sans" font-size="12" fill="#B7C7E0">LiteLLM / Ollama</text><text x="769" y="270" class="sans" font-size="12" fill="#B7C7E0">Gradio / Docker</text><rect x="990" y="160" width="205" height="135" rx="12" fill="#0D1B2E" stroke="#324564"/><rect x="990" y="160" width="205" height="3" rx="1" fill="#43E8E1"/><text x="1004" y="187" class="mono" font-size="10" letter-spacing="1.1" fill="#A78BFA">05 / EVIDENCE</text><text x="1004" y="217" class="sans" font-size="15" font-weight="700" fill="#EFF5FF">Validate &amp; inspect</text><text x="1004" y="247" class="sans" font-size="12" fill="#B7C7E0">Pytest / safety gates</text><text x="1004" y="270" class="sans" font-size="12" fill="#B7C7E0">OpenTelemetry</text></svg>
